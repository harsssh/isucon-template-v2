[defaults]
inventory = ansible/inventory.yml
roles_path = ansible/roles
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml

[ssh_connection]
pipelining = True
# サーバー上の git clone, push で手元の SSH 鍵を使うため ForwardAgent を有効にする
# 作り直したインスタンスで host key の確認が止まらないよう accept-new にする
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o ForwardAgent=yes -o StrictHostKeyChecking=accept-new
