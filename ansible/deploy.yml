# origin のブランチを全サーバーにデプロイする
#   make deploy BRANCH=main
- name: Deploy
  hosts: all
  gather_facts: false
  vars:
    branch: main
    # 配布で設定ファイルが変わったときに再起動するサービスと、その設定ファイルのディレクトリ
    # unit ファイル (<サービス名>.service) が変わったときも再起動する
    service_config_dirs:
      nginx: [/etc/nginx/]
      mysql: [/etc/mysql/]
    # 最後に空にするログ。ベンチごとの集計を分けるため
    rotated_logs:
      - /var/log/nginx/access.log
      - /var/log/mysql/mysql-slow.log
  tasks:
    - name: Find application service
      ansible.builtin.import_tasks: tasks/find_app_service.yml

    - name: Application service must be found
      ansible.builtin.assert:
        that: app_service is defined
        fail_msg: >-
          WorkingDirectory が {{ app_dir }} のサービスが 1 つに決まりません
          (候補: {{ app_service_candidates }})。
          ansible/group_vars/all.yml で app_service を指定してください

    # サーバー上の変更は捨てる
    - name: Checkout branch
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dir }}"
        version: "{{ branch }}"
        force: true
        accept_newhostkey: true

    # Go などの PATH は ~/.bashrc で設定されているので、対話シェルとして読み込む
    - name: Build application
      when: app_service in host_services
      ansible.builtin.command: bash -ic make
      args:
        chdir: "{{ app_dir }}"
      changed_when: true

    # スクリプトは手元から送るので、サーバー上の checkout の状態によらない
    - name: Distribute config files
      become: true
      ansible.builtin.script:
        cmd: distribute_config.sh {{ inventory_hostname | quote }}
        chdir: "{{ repo_dir }}"
      register: distributed_config
      changed_when: distributed_config.stdout_lines | length > 0

    - name: Decide actions from changed config files
      ansible.builtin.set_fact:
        deploy_plan: "{{ distributed_config.stdout_lines | deploy_actions(host_services, app_service, service_config_dirs) }}"

    - name: Reload systemd
      when: deploy_plan.daemon_reload
      become: true
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Reload sysctl
      when: deploy_plan.reload_sysctl
      become: true
      ansible.builtin.command: sysctl --system
      changed_when: true

    - name: Stop services assigned to other hosts
      become: true
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop: "{{ assigned_services | difference(host_services) }}"

    - name: Restart services
      become: true
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: restarted
        enabled: true
      loop: "{{ deploy_plan.restart_services }}"

    - name: Start other services
      become: true
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop: "{{ host_services | difference(deploy_plan.restart_services) }}"

    # 存在しないログは作らない (-c)
    - name: Rotate logs
      become: true
      ansible.builtin.command:
        argv: "{{ ['truncate', '-c', '-s', '0'] + rotated_logs }}"
      changed_when: true

    # サービスの配置の変更を、pprotein が計測データを取るホストに反映する
    - name: Update pprotein targets
      when: inventory_hostname in groups.primary
      ansible.builtin.include_role:
        name: pprotein
        tasks_from: targets
