# ホスト名は ~/.ssh/config の Host 名と一致させる
# セットアップ時にサーバーの hostname もこの名前に変わり、deploy で s1/ などのホスト別の設定が配布される
# 変数は group_vars/all.yml に書き、ホストごとに変えるものだけここに書く
all:
  # サービスの配置をホストごとに変えるときは host_services を上書きする
  # 例: s1 で nginx とアプリ、s2 で MySQL を動かす
  #   s1:
  #     host_services: [nginx, "{{ app_service }}"]
  #   s2:
  #     host_services: ["{{ db_service }}"]
  hosts:
    s1:
    s2:
    s3:
    # s4:
    # s5:
  children:
    # webapp の取り込み元、設定ファイルの収集元、pprotein サーバーを置くホスト。1 台だけ指定する
    primary:
      hosts:
        s1:
