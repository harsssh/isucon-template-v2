# サーバーの状態を survey/<host>.md に書き出し、ansible の前提と合わない点を表示する
# サーバーは変更しないので、make setup の前に何度実行してもよい
#   make survey
- name: Survey servers
  hosts: all
  vars:
    survey_dir: "{{ playbook_dir }}/../survey"
    survey_go_paths: "{{ go_bin_dirs | map('regex_replace', '$', '/go') | list }}"
  tasks:
    - name: Find services
      ansible.builtin.import_tasks: tasks/find_services.yml

    - name: Collect server state
      become: true
      ansible.builtin.script: survey.sh {{ webapp_dir | quote }}
      register: survey_state
      changed_when: false

    - name: Gather services
      ansible.builtin.service_facts:

    # ~/.bashrc の PATH にある Go も、deploy のビルドで使われる
    - name: Find Go in interactive shell
      ansible.builtin.command: bash -ic 'command -v go'
      register: survey_shell_go
      changed_when: false
      failed_when: false

    # 手元の ssh-agent の鍵を転送して接続する。known_hosts は変更しない
    # clone: false では clone せず、ls-remote で接続だけ確かめる。接続できると after に main の commit が入る
    - name: Check access to origin
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        version: main
        dest: /nonexistent
        clone: false
        update: false
        ssh_opts: -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null
      register: survey_origin_access
      failed_when: false

    # deploy は primary から集めた設定ファイルを全ホストに配るので、primary と違うファイルを見つける
    # env.sh には自ホストの IP など、ホストごとに違う値が入っていることがある
    - name: Checksum config files distributed by deploy
      become: true
      ansible.builtin.shell: |
        set -o pipefail
        {
          find /etc/nginx /etc/mysql /etc/sysctl.d -type f 2>/dev/null
          # unit の EnvironmentFile は、無くてもよい (-) と指定されていることがある
          printf '%s\n' "$ENV_FILES" | while read -r env_file; do
            if [ -f "$env_file" ]; then echo "$env_file"; fi
          done
        } | sort -u | xargs -r -d '\n' sha256sum
      args:
        executable: /bin/bash
      environment:
        ENV_FILES: "{{ app_env_files | default([]) | join('\n') }}"
      register: survey_config_checksums
      changed_when: false

    - name: Check paths
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ [app_dir ~ '/Makefile'] + survey_go_paths }}"
      register: survey_paths

    # 前提ごとに、満たしているかを ok に入れる
    - name: Check assumptions
      vars:
        existing_paths: "{{ survey_paths.results | selectattr('stat.exists') | map(attribute='item') | list }}"
        unit_names: "{{ ansible_facts.services | list | map('regex_replace', '\\.service$', '') | list }}"
        # --limit で外したホストは app_service が決まらないので、実行中のホストだけを見る
        play_services: "{{ ansible_play_hosts | map('extract', hostvars, 'host_services') | flatten | unique }}"
        missing_services: "{{ play_services | difference(unit_names) if app_service is defined else [] }}"
        primary_host: "{{ groups.primary | first }}"
        primary_config_checksums: "{{ hostvars[primary_host].survey_config_checksums.stdout | default(none) }}"
        differing_files: >-
          {{ survey_config_checksums.stdout | differing_config_files(primary_config_checksums)
             if primary_config_checksums is not none else [] }}
      ansible.builtin.set_fact:
        survey_checks:
          - assumption: "OS が Debian 系で、アーキテクチャが x86_64 か aarch64 ({{ ansible_facts.distribution }}, {{ ansible_facts.architecture }})"
            ok: "{{ ansible_facts.os_family == 'Debian' and ansible_facts.architecture in ['x86_64', 'aarch64'] }}"
          - assumption: "サーバーから origin ({{ repo_url }}) に接続できる (手元の ssh-agent の鍵を転送する。ssh-add -l で鍵を確かめる)"
            ok: "{{ survey_origin_access.after is defined }}"
          - assumption: "WorkingDirectory が {{ app_dir }} のサービスが 1 つに決まる (候補: {{ app_service_candidates }})"
            ok: "{{ app_service is defined }}"
          - assumption: >-
              {{ app_dir }}/Makefile があるか、ExecStart の実行ファイル ({{ app_binary | default('不明') }}) が
              {{ app_dir }} にある (deploy で make を実行する。Makefile が無ければ setup で作る)
            ok: "{{ app_dir ~ '/Makefile' in existing_paths or (app_binary | default('') or '').startswith(app_dir ~ '/') }}"
          - assumption: >-
              Go が対話シェルの PATH ({{ survey_shell_go.stdout | default('', true) or '無し' }}) か
              {{ go_bin_dirs }} のどれかにある (deploy のビルドで使う)
            ok: "{{ survey_shell_go.stdout != '' or survey_go_paths | intersect(existing_paths) | length > 0 }}"
          - assumption: >-
              inventory の host_services の unit ファイルがある
              ({{ '無いもの: ' ~ missing_services if app_service is defined else 'アプリのサービスが決まらないので未確認' }})
            ok: "{{ app_service is defined and missing_services | length == 0 }}"
          - assumption: >-
              アプリが listen しているポートが分かる ({{ app_port | default(none) or '不明' }}。pprotein の pprof の取得先にする。
              unit のプロセスが listen していなければ、nginx の自ホストへの転送先 {{ nginx_dump | nginx_local_upstream_ports }} が 1 つのときにそれを使う)
            ok: "{{ app_port | default(none) is not none }}"
          - assumption: >-
              nginx が /etc/nginx/conf.d/*.conf を読み込む (LTSV のアクセスログの設定先。
              {{ 'nginx -T が失敗した' if nginx_dump == '' else 'nginx -T の include から判定' }})
            ok: "{{ nginx_dump | nginx_includes('/etc/nginx/conf.d/ltsv-log.conf') }}"
          - assumption: "/etc/mysql/my.cnf の !includedir から slow log の設定先が決まる ({{ db_conf_dir or '不明' }}。サービス名: {{ db_service }})"
            ok: "{{ db_conf_dir is not none }}"
          - assumption: >-
              /etc/nginx, /etc/mysql, /etc/sysctl.d, アプリの環境変数のファイル {{ app_env_files | default([]) }} が primary ({{ primary_host }}) と同じ
              (最初の deploy で primary のものに上書きされる。ホストごとに違う値は s2/ などに置く。
              {{ '違うもの: ' ~ differing_files if primary_config_checksums is not none else 'primary を含めずに実行したので未確認' }})
            ok: "{{ primary_config_checksums is not none and differing_files | length == 0 }}"

    - name: Create survey directory
      delegate_to: localhost
      ansible.builtin.file:
        path: "{{ survey_dir }}"
        state: directory
        mode: "0755"

    - name: Save survey
      delegate_to: localhost
      ansible.builtin.copy:
        dest: "{{ survey_dir }}/{{ inventory_hostname }}.md"
        mode: "0644"
        content: |
          # {{ inventory_hostname }}

          `make survey` で集めたサーバーの状態。

          ## ansible の前提

          {% for check in survey_checks %}
          - {{ 'OK' if check.ok else 'NG' }}: {{ check.assumption }}
          {% endfor %}

          {{ survey_state.stdout }}

    - name: Show unmet assumptions
      when: unmet_assumptions | length > 0
      vars:
        unmet_assumptions: "{{ survey_checks | rejectattr('ok') | map(attribute='assumption') | list }}"
      ansible.builtin.debug:
        msg: "{{ unmet_assumptions }}"
