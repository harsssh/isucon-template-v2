# 手元の tmux の設定から、プラグインと macOS に依存する部分を除いたもの

# -----------------------------------------------------------------------------
# 基本設定
# -----------------------------------------------------------------------------

set -g prefix C-b
# 手元の tmux の中から ssh したときは C-b C-b でこちらに送る
bind C-b send-prefix

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -sg escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g history-limit 20000

# コピーした内容を OSC 52 で手元のクリップボードに送る
set -g set-clipboard on

# 再接続すると転送された ssh-agent のソケットが変わるので、ログインのたびに張り直す固定のパスを使う (~/.bashrc)
# 既存のペインでもサーバー上の git で手元の鍵を使えるようにするため
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"
set-environment -g SSH_AUTH_SOCK "$HOME/.ssh/agent.sock"

# -----------------------------------------------------------------------------
# キーバインド設定
# -----------------------------------------------------------------------------

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# vim 風のペイン移動。vim の中ではキーを vim に送り、端では折り返さない
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'if-shell "[ #{pane_at_left} -ne 1 ]" "select-pane -L"'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'if-shell "[ #{pane_at_bottom} -ne 1 ]" "select-pane -D"'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'if-shell "[ #{pane_at_top} -ne 1 ]" "select-pane -U"'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'if-shell "[ #{pane_at_right} -ne 1 ]" "select-pane -R"'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind-key -T copy-mode-vi 'C-h' if-shell "[ #{pane_at_left} -ne 1 ]" "select-pane -L"
bind-key -T copy-mode-vi 'C-j' if-shell "[ #{pane_at_bottom} -ne 1 ]" "select-pane -D"
bind-key -T copy-mode-vi 'C-k' if-shell "[ #{pane_at_top} -ne 1 ]" "select-pane -U"
bind-key -T copy-mode-vi 'C-l' if-shell "[ #{pane_at_right} -ne 1 ]" "select-pane -R"
bind-key -T copy-mode-vi 'C-\' select-pane -l

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind '{' swap-pane -U
bind '}' swap-pane -D

bind -r C-h previous-window
bind -r C-l next-window

bind S set-window-option synchronize-panes\; display-message "synchronize-panes: #{?pane_synchronized,ON,OFF}"

setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ホイール 1 イベントあたりのスクロール量 (既定は 5 行で、トラックパッドだと飛んで見える)
bind -T copy-mode-vi WheelUpPane   select-pane \; send -N3 -X scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -N3 -X scroll-down

# -----------------------------------------------------------------------------
# ステータスライン設定
# -----------------------------------------------------------------------------

set -g status-interval 5
set -g status-position bottom
set -g status-left-length 100
set -g status-right-length 100
set -g status-style 'bg=#313244 fg=#cdd6f4'

# 手元の tmux と見分けるため、左端はホスト名にして色を変える
set -g status-left '#[bg=#fab387,fg=#1e1e2e,bold] #h #[bg=#45475a,fg=#cdd6f4] #S #[bg=#313244] '
set -g status-right '#{?client_prefix,#[bg=#89b4fa fg=#1e1e2e bold] PREFIX ,}#{?pane_in_mode,#[bg=#f9e2af fg=#1e1e2e bold] COPY ,}#[bg=#f9e2af,fg=#1e1e2e,bold] %H:%M '

setw -g window-status-format '#[bg=#45475a,fg=#6c7086] #I:#W '
setw -g window-status-current-format '#[bg=#fab387,fg=#1e1e2e,bold] #I:#{?#{==:#W,#{pane_current_command}},#W,#W #{pane_current_command}} '

set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#fab387'
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'
set -g pane-border-status top
set -g pane-border-format '#{?pane_active,#[fg=#fab387] #{pane_index} ,#[fg=#6c7086] #{pane_index} }'

set -g message-style 'bg=#313244 fg=#cdd6f4'
set -g message-command-style 'bg=#313244 fg=#cdd6f4'

# -----------------------------------------------------------------------------
# アクティビティ監視設定
# -----------------------------------------------------------------------------

setw -g monitor-activity off
set -g visual-activity off
set -g visual-bell off
set -g bell-action none
