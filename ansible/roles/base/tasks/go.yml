# 既定では実行しない。サーバーの Go が 1.21 未満のときだけ `ansible-playbook ansible/setup.yml --tags go` で実行する
# go 1.21 以降は go.mod の go 行と toolchain 行が求めるバージョンを自動で取得するので、入れ替えなくてよい
- name: Check installed Go version
  ansible.builtin.command: /usr/local/go/bin/go version
  register: base_installed_go
  changed_when: false
  failed_when: false

- name: Replace Go
  when: ("go" ~ base_go_version ~ " ") not in base_installed_go.stdout
  become: true
  block:
    - name: Remove old Go
      ansible.builtin.file:
        path: /usr/local/go
        state: absent

    - name: Extract Go
      ansible.builtin.unarchive:
        src: "https://go.dev/dl/go{{ base_go_version }}.linux-{{ release_arch }}.tar.gz"
        dest: /usr/local
        remote_src: true
