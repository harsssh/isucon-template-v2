# setup と deploy が書き換えるファイルを、最初の setup の前の状態で退避する。想定外の構成のときに手で戻すため
# 2 回目以降の setup では、書き換えた後の状態で上書きしないよう何もしない
- name: Back up files changed by setup and deploy
  become: true
  ansible.builtin.shell: |
    set -e
    # /etc/mysql/debian.cnf などのパスワードを含むので、root だけが読めるようにする
    umask 077
    # 無いパスは --ignore-failed-read で無視する
    tar --ignore-failed-read -czf {{ base_backup_path }}.tmp \
      /etc/nginx /etc/mysql /etc/sysctl.d /etc/systemd/system /lib/systemd/system \
      /etc/hostname /etc/hosts \
      {{ home_dir }}/env* {{ home_dir }}/.bashrc {{ home_dir }}/.gitconfig \
      {{ (app_env_files | default([])) | map('quote') | join(' ') }}
    mv {{ base_backup_path }}.tmp {{ base_backup_path }}
  args:
    creates: "{{ base_backup_path }}"

# deploy で配布するホスト別の設定 (s1/ など) は hostname で選ばれるので、最初に設定する
- name: Set hostname
  become: true
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

# EC2 では cloud-init が起動のたびに hostname を戻すので、再起動試験の後に別ホストの設定が配布されてしまう
- name: Check cloud-init config directory
  ansible.builtin.stat:
    path: /etc/cloud/cloud.cfg.d
  register: base_cloud_cfg_d

- name: Keep hostname after reboot
  when: base_cloud_cfg_d.stat.exists
  become: true
  ansible.builtin.copy:
    content: "preserve_hostname: true\n"
    dest: /etc/cloud/cloud.cfg.d/99-preserve-hostname.cfg
    mode: "0644"

# 他のホストの IP は gather_facts で集めるので、--limit で一部のホストだけ実行すると分からない
- name: All hosts must have gathered facts
  ansible.builtin.assert:
    that: groups.all | map('extract', hostvars) | selectattr('ansible_facts.default_ipv4', 'undefined') | length == 0
    fail_msg: 他のホストの IP が分からないので、--limit を付けずに全ホストで実行してください

# common/ の設定ファイルで他のホストを s2 のように名前で指定できるようにし、ホスト別の設定を減らす
# 自分自身は 127.0.0.1 にして、自ホスト内の通信がループバックを通るようにする
- name: Resolve all hosts by name
  become: true
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ISUCON HOSTS"
    block: |
      {% for host in groups.all %}
      {{ '127.0.0.1' if host == inventory_hostname else hostvars[host].ansible_facts.default_ipv4.address }} {{ host }}
      {% endfor %}

- name: Install apt packages
  become: true
  ansible.builtin.apt:
    name: [git, rsync, tree, jq, graphviz, wget, watch, tmux]
    update_cache: true
    cache_valid_time: 3600
    # 起動直後は unattended-upgrades が apt のロックを持っていることがある
    lock_timeout: 300

- name: Install bottom
  become: true
  ansible.builtin.apt:
    deb: "https://github.com/ClementTsang/bottom/releases/download/{{ base_bottom_version }}/bottom_{{ base_bottom_version }}-1_{{ release_arch }}.deb"
    lock_timeout: 300

- name: Create config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - ~/.config/bottom
    - ~/.config/tmux

- name: Install config files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: bottom.toml, dest: ~/.config/bottom/bottom.toml }
    - { src: tmux.conf, dest: ~/.config/tmux/tmux.conf }

- name: Configure git
  community.general.git_config:
    scope: global
    name: "{{ item.name }}"
    value: "{{ item.value }}"
  loop:
    - { name: user.name, value: "{{ inventory_hostname }}" }
    - { name: user.email, value: "{{ inventory_hostname }}@example.com" }
    - { name: core.editor, value: vim }
    - { name: pull.rebase, value: "true" }

- name: Configure shell
  ansible.builtin.blockinfile:
    path: ~/.bashrc
    marker: "# {mark} MANAGED BY ANSIBLE (base)"
    block: |
      export PATH={{ go_bin_dirs | join(':') }}:$PATH
      alias sc="sudo systemctl"
      alias scs="sudo systemctl status"
      alias jc="sudo journalctl"
      alias jcf="sudo journalctl -f"
      alias jcfu="sudo journalctl -f -u"
      alias rm="rm -i"
      alias mkdir="mkdir -p"
      alias dc="docker compose"
      alias g="git"
      alias b="btm"
      # ssh でログインするたびに、転送された ssh-agent のソケットを固定のパスに張る。tmux はこのパスを使う
      # ansible の接続 (SSH_TTY が無い) で張り替えると、接続が切れた後に壊れたリンクが残るので除く
      if [ -n "$SSH_TTY" ] && [ -z "$TMUX" ] && [ -S "$SSH_AUTH_SOCK" ]; then
        ln -sf "$SSH_AUTH_SOCK" ~/.ssh/agent.sock
      fi

- name: Install Go
  ansible.builtin.import_tasks: go.yml
  tags: [never, go]
