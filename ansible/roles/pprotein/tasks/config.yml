# pprotein の設定は全部このリポジトリが正で、pprotein の画面で編集しても次の deploy で消える
# pprotein は収集のたびにこれらのファイルを読むので、再起動しなくてよい

# 取得先は inventory の host_services から作る
- name: Install pprotein targets
  become: true
  ansible.builtin.template:
    src: targets.json.j2
    dest: /etc/pprotein/data/targets.json
    mode: "0644"

# alp.yml と slp.yml は config/common/ にあり、deploy がデプロイするブランチの内容を配る
# setup はサーバーにリポジトリを clone する前に動くので、無いときだけ手元のファイルを置く。
# 上書きすると、手元で checkout しているブランチの内容で、deploy したブランチの設定を戻してしまう
- name: Install initial pprotein alp and slp config
  become: true
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../config/common/etc/pprotein/data/{{ item }}"
    dest: "/etc/pprotein/data/{{ item }}"
    mode: "0644"
    force: false
  loop: [alp.yml, slp.yml]
