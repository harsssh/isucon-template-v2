# /opt にバージョンごとのディレクトリを作ってリンクするのは、creates がバージョンを含むパスを見るようにするため。defaults のバージョンを変えると、セットアップ済みのサーバーでも入れ替わる
- name: Create directories for pprotein, alp and slp
  become: true
  ansible.builtin.file:
    path: "/opt/{{ item.name }}-{{ item.version }}"
    state: directory
    mode: "0755"
  loop: "{{ pprotein_tools }}"

- name: Install pprotein, alp and slp
  become: true
  ansible.builtin.unarchive:
    src: "{{ item.url }}"
    dest: "/opt/{{ item.name }}-{{ item.version }}"
    remote_src: true
    include: "{{ item.binaries }}"
    creates: "/opt/{{ item.name }}-{{ item.version }}/{{ item.binaries[0] }}"
  loop: "{{ pprotein_tools }}"

- name: Link pprotein, alp and slp
  become: true
  ansible.builtin.file:
    src: "/opt/{{ item.0.name }}-{{ item.0.version }}/{{ item.1 }}"
    dest: "/usr/local/bin/{{ item.1 }}"
    state: link
    # 以前は /usr/local/bin に直接展開していたので、そのファイルを置き換える
    force: true
  loop: "{{ pprotein_tools | subelements('binaries') }}"
  notify: Restart pprotein services

- name: Install systemd units
  become: true
  ansible.builtin.template:
    src: "{{ item }}.service.j2"
    dest: "/etc/systemd/system/{{ item }}.service"
    mode: "0644"
  loop: [pprotein, pprotein-agent]
  notify: Restart pprotein services

- name: Create pprotein data directory
  become: true
  ansible.builtin.file:
    path: /etc/pprotein/data
    state: directory
    mode: "0755"

- name: Install pprotein targets
  when: inventory_hostname in groups.pprotein_server
  ansible.builtin.import_tasks: targets.yml

# pprotein の画面で編集した設定を上書きしない
- name: Install pprotein config
  become: true
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/pprotein/data/{{ item }}"
    mode: "0644"
    force: false
  loop: [alp.yml, slp.yml]

- name: Start pprotein-agent
  become: true
  ansible.builtin.systemd_service:
    name: pprotein-agent
    state: started
    enabled: true
    daemon_reload: true

- name: Start pprotein
  when: inventory_hostname in groups.pprotein_server
  become: true
  ansible.builtin.systemd_service:
    name: pprotein
    state: started
    enabled: true
    daemon_reload: true

# pprotein_server を別のホストに変えたとき、元のホストの pprotein を止める
- name: Stop pprotein on other hosts
  when: inventory_hostname not in groups.pprotein_server
  become: true
  ansible.builtin.systemd_service:
    name: pprotein
    state: stopped
    enabled: false
    daemon_reload: true
