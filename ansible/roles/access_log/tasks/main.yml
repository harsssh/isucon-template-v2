# nginx と MySQL のログを alp, slp で集計できる形式にする
# 設定は /etc に直接書き、collect_config で common/ に取り込む
- name: Check whether nginx config includes conf.d
  ansible.builtin.command: grep -Eq '^\s*include\s+/etc/nginx/conf\.d/\*\.conf;' /etc/nginx/nginx.conf
  register: access_log_nginx_includes_conf_d
  changed_when: false
  failed_when: false

- name: Warn about nginx config without conf.d
  when: access_log_nginx_includes_conf_d.rc != 0
  ansible.builtin.debug:
    msg: /etc/nginx/nginx.conf が無いか conf.d を読み込んでいないので、LTSV のログは手で設定してください

- name: Configure nginx access log
  when: access_log_nginx_includes_conf_d.rc == 0
  become: true
  block:
    - name: Install LTSV log config
      ansible.builtin.copy:
        src: ltsv-log.conf
        dest: /etc/nginx/conf.d/ltsv-log.conf
        mode: "0644"
      notify: Restart nginx

    # http ブロックの access_log が残ると、同じファイルに 2 つの形式で書き込まれる
    - name: Disable default access log
      ansible.builtin.replace:
        path: /etc/nginx/nginx.conf
        regexp: '^(\s*)(access_log\s)'
        replace: '\1# \2'
      notify: Restart nginx

    - name: Validate nginx config
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Find server-level access_log directives
      ansible.builtin.find:
        paths: [/etc/nginx/sites-enabled, /etc/nginx/conf.d]
        contains: '^\s*access_log\s'
        excludes: [ltsv-log.conf]
        follow: true
      register: access_log_overriding_access_logs

    - name: Warn about access_log overriding LTSV log
      when: access_log_overriding_access_logs.matched > 0
      ansible.builtin.debug:
        msg: "{{ access_log_overriding_access_logs.files | map(attribute='path') | join(', ') }} の access_log が LTSV のログを上書きします。削除するか ltsv 形式に変えてください"

- name: Find MySQL config directory
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/mysql/mysql.conf.d
    - /etc/mysql/mariadb.conf.d
  register: access_log_mysql_conf_dir_candidates

# mysqld.cnf などの既存の設定より後に読まれるよう、99- で始める
- name: Install slow log config
  when: access_log_mysql_conf_dirs | length > 0
  become: true
  vars:
    access_log_mysql_conf_dirs: "{{ access_log_mysql_conf_dir_candidates.results | selectattr('stat.exists') | map(attribute='item') | list }}"
  ansible.builtin.copy:
    src: slow-log.cnf
    dest: "{{ access_log_mysql_conf_dirs[0] }}/99-slow-log.cnf"
    mode: "0644"
  notify: Restart mysql
