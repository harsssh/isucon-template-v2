# nginx と MySQL のログを alp, slp で集計できる形式にする
# 設定は /etc に直接書き、collect_config で config/common/ に取り込む
# 置き場所は tasks/find_services.yml が調べた nginx_dump, db_conf_dir, db_service で決める
- name: Warn about nginx config without conf.d
  when: not access_log_nginx_includes_conf_d
  ansible.builtin.debug:
    msg: >-
      {{ 'nginx -T が失敗したので' if nginx_dump == '' else 'nginx が /etc/nginx/conf.d/*.conf を読み込んでいないので' }}、
      LTSV のログは手で設定してください

- name: Configure nginx access log
  when: access_log_nginx_includes_conf_d
  become: true
  block:
    - name: Install LTSV log config
      ansible.builtin.copy:
        src: ltsv-log.conf
        dest: /etc/nginx/conf.d/ltsv-log.conf
        mode: "0644"
      notify: Restart nginx

    # http ブロックの access_log が残ると、同じファイルに 2 つの形式で書き込まれる
    - name: Disable default access log
      ansible.builtin.replace:
        path: /etc/nginx/nginx.conf
        regexp: '^(\s*)(access_log\s)'
        replace: '\1# \2'
      notify: Restart nginx

    # 書き換えた後の設定で、構文と access_log を確かめる
    - name: Show nginx config after change
      ansible.builtin.command: nginx -T
      register: access_log_nginx_dump
      changed_when: false

    - name: Warn about access_log overriding LTSV log
      when: overriding_files | length > 0
      vars:
        overriding_files: "{{ access_log_nginx_dump.stdout | nginx_files_with_directive('access_log') | difference(['/etc/nginx/conf.d/ltsv-log.conf']) }}"
      ansible.builtin.debug:
        msg: "{{ overriding_files | join(', ') }} の access_log が LTSV のログを上書きします。削除するか ltsv 形式に変えてください"

- name: Warn about MySQL config without includedir
  when: db_conf_dir is none
  ansible.builtin.debug:
    msg: /etc/mysql/my.cnf が無いか !includedir が無いので、slow log は手で設定してください

# 最後に読み込まれるディレクトリの中でも、mysqld.cnf などの既存の設定より後に読まれるよう、99- で始める
- name: Install slow log config
  when: db_conf_dir is not none
  become: true
  ansible.builtin.copy:
    src: slow-log.cnf
    dest: "{{ db_conf_dir }}/99-slow-log.cnf"
    mode: "0644"
  notify: Restart database
