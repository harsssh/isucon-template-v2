# アプリのサービスを見つけ、次の変数を設定する
#   app_service_candidates: WorkingDirectory が app_dir のサービス
#   app_service: 候補が 1 つに決まり、指定されていなければその名前
#   app_binary: ExecStart の実行ファイル。setup で Makefile を作るのに使う
#   app_port: アプリが listen しているポート。pprotein の pprof の取得先にする
- name: Show working directories of isu* services
  ansible.builtin.shell: |
    set -o pipefail
    systemctl list-unit-files --type=service --no-legend 'isu*' | awk '$1 !~ /@/ {print $1}' |
      xargs -r systemctl show -p Id -p WorkingDirectory
  args:
    executable: /bin/bash
  register: isu_units
  changed_when: false

- name: Set application service candidates
  ansible.builtin.set_fact:
    app_service_candidates: "{{ isu_units.stdout | services_in_directory(app_dir) }}"

- name: Set application service
  when: app_service is undefined and app_service_candidates | length == 1
  ansible.builtin.set_fact:
    app_service: "{{ app_service_candidates | first }}"

- name: Find application process
  when: app_service is defined
  block:
    # state を指定しないと何も変えず、status に unit のプロパティが入る
    - name: Show application process
      ansible.builtin.systemd_service:
        name: "{{ app_service }}"
      register: app_process

    # 他のユーザーのプロセスも見えるよう root で実行する
    - name: Show listening ports
      become: true
      ansible.builtin.command: ss -Htlnp
      register: app_listening_ports
      changed_when: false

    - name: Set application binary and port
      ansible.builtin.set_fact:
        app_binary: "{{ app_process.status.ExecStart | exec_start_path }}"
        app_port: "{{ app_listening_ports.stdout | listening_port(app_process.status.MainPID) }}"
