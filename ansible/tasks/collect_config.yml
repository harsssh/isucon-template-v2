# primary の設定ファイルを common/ にコピーする。common/ のファイルより新しいものだけを上書きする
- name: Collect config files into common/
  vars:
    # 存在しないパスは無視される
    collect_paths:
      - /home/isucon/env.sh
      - /etc/mysql
      - /etc/nginx
      - /etc/sysctl.d
    # unit ファイルを集めるサービス。isu で始まるサービスは自動で追加される
    collect_services:
      - mysql
      - nginx
  block:
    - name: Find unit files of related services
      ansible.builtin.shell: |
        set -o pipefail
        {
          printf '%s\n' {{ collect_services | join(' ') }}
          systemctl list-unit-files --type=service --no-legend 'isu*' | awk '{print $1}'
        } | while read -r service_name; do
          systemctl show --value -p FragmentPath "$service_name"
        done | sed '/^$/d'
      args:
        executable: /bin/bash
      register: unit_files
      changed_when: false

    - name: Copy config files
      ansible.builtin.script:
        cmd: collect_config.sh {{ (collect_paths + unit_files.stdout_lines) | map('quote') | join(' ') }}
        chdir: "{{ repo_dir }}"
      changed_when: true
