# 競技サーバーの初回セットアップ。何度実行しても同じ状態になる
#   ansible-playbook ansible/setup.yml
# Go を入れ替えるときだけ --tags go を付けて実行する
- name: Check local repository
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Origin must be an SSH URL so that servers can push with the forwarded agent
      ansible.builtin.assert:
        that: repo_url is match('^(git@|ssh://)')
        fail_msg: "origin が SSH 形式ではありません: {{ repo_url }}"

- name: Install tools on all servers
  hosts: all
  pre_tasks:
    - name: Find application service
      ansible.builtin.import_tasks: tasks/find_app_service.yml
  roles:
    - base
    - pprotein

# primary の webapp と設定ファイルをリポジトリに取り込んで push する
# 他のホストはこの push の後に clone する
- name: Import webapp on primary
  hosts: primary
  roles:
    - repo
    - access_log
  tasks:
    - name: Collect config files
      ansible.builtin.import_tasks: tasks/collect_config.yml

    # Makefile が無い参照実装では、unit ファイルが起動する実行ファイルをビルドする Makefile を作る
    - name: Create Makefile for application
      when: (app_binary | default('') or '').startswith(app_dir ~ '/')
      ansible.builtin.template:
        src: templates/Makefile.j2
        dest: "{{ app_dir }}/Makefile"
        mode: "0644"
        force: false

    - name: Commit and push imported files
      ansible.builtin.shell: |
        set -e
        # 取り込み済みなら何もしない。競技中の再実行で、サーバー上の編集を push しないため
        if [ -n "$(git ls-files -- app common ':!app/.gitkeep')" ]; then
          echo "nothing to commit"
          exit 0
        fi
        git add app common
        git commit -q -m "import webapp and config from {{ inventory_hostname }}"
        git push -q origin HEAD
      args:
        chdir: "{{ repo_dir }}"
      register: push_result
      changed_when: push_result.stdout != "nothing to commit"

- name: Link webapp on other servers
  hosts: all:!primary
  roles:
    - repo
