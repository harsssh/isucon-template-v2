# 競技サーバーの初回セットアップ。何度実行しても同じ状態になる
#   ansible-playbook ansible/setup.yml
# Go を入れ替えるときだけ --tags go を付けて実行する
- name: Check local repository
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Origin must be an SSH URL so that servers can push with the forwarded agent
      ansible.builtin.assert:
        that: repo_url is match('^(git@|ssh://)')
        fail_msg: "origin が SSH 形式ではありません: {{ repo_url }}"

    - name: Pprotein server must be a single host
      ansible.builtin.assert:
        that: groups.pprotein_server | default([]) | length == 1
        fail_msg: "inventory.yml の pprotein_server には 1 台だけ指定してください: {{ groups.pprotein_server | default([]) }}"

- name: Install tools on all servers
  hosts: all
  pre_tasks:
    - name: Find services
      ansible.builtin.import_tasks: tasks/find_services.yml
  roles:
    - base
    - pprotein

# primary の webapp と設定ファイルをリポジトリに取り込んで push する
# 他のホストはこの push の後に clone する
# サーバーの元の状態を git に残すため、setup が手を加える前と後で 1 回ずつコミットする
- name: Import webapp on primary
  hosts: primary
  vars:
    is_first_import: "{{ pushed_config.stdout_lines | difference(['common/.gitkeep']) | length == 0 }}"
  roles:
    - repo
  tasks:
    # push 済みなら取り込まない。競技中の再実行で、サーバー上の編集を push しないため
    # push の前に失敗したときは、再実行で続きから取り込む
    - name: Check whether config files are already pushed
      ansible.builtin.shell: |
        set -e
        git ls-tree -r --name-only origin/main -- common
      args:
        chdir: "{{ repo_dir }}"
      register: pushed_config
      changed_when: false

    - name: Commit original webapp and config
      when: is_first_import
      block:
        - name: Collect original config files
          ansible.builtin.import_tasks: tasks/collect_config.yml

        - name: Commit original files
          ansible.builtin.shell: |
            set -e
            git add app common
            if git diff --cached --quiet; then
              echo "nothing to commit"
              exit 0
            fi
            git commit -q -m "import webapp and config from {{ inventory_hostname }}"
          args:
            chdir: "{{ repo_dir }}"
          register: original_commit
          changed_when: original_commit.stdout != "nothing to commit"

    - name: Configure logs for alp and slp
      ansible.builtin.import_role:
        name: access_log

    - name: Commit and push changes by setup
      when: is_first_import
      block:
        - name: Collect config files changed by setup
          ansible.builtin.import_tasks: tasks/collect_config.yml

        # Makefile が無い参照実装では、unit ファイルが起動する実行ファイルをビルドする Makefile を作る
        - name: Create Makefile for application
          when: (app_binary | default('') or '').startswith(app_dir ~ '/')
          ansible.builtin.template:
            src: templates/Makefile.j2
            dest: "{{ app_dir }}/Makefile"
            mode: "0644"
            force: false

        - name: Commit and push changes
          ansible.builtin.shell: |
            set -e
            git add app common
            git diff --cached --quiet || git commit -q -m "configure logs for alp and slp and add files for deploy"
            git push -q origin HEAD
          args:
            chdir: "{{ repo_dir }}"
          changed_when: true

- name: Link webapp on other servers
  hosts: all:!primary
  roles:
    - repo
